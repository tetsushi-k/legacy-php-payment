name: CI

on:
  push:
    branches: [main, 'cloud/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build --wait

      - name: Install dependencies
        run: docker compose run --rm cli composer install --no-interaction

      - name: Run characterization tests
        run: docker compose run --rm cli ./vendor/bin/phpunit

      - name: Run PHPStan
        run: docker compose run --rm cli ./vendor/bin/phpstan analyse -c phpstan.neon
